# GitHub Actions Workflow for deploying to Google Cloud
# Triggers Cloud Build on push to main or release branches

name: Deploy to Google Cloud

on:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cre-platform

jobs:
  # Job 1: Run tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint --if-present
        continue-on-error: true

      - name: Run tests
        run: npm test --if-present
        continue-on-error: true

      - name: Build shared library
        run: |
          cd services/shared
          npm run build

  # Job 2: Build and push images
  build:
    name: Build Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push AI Service
        run: |
          docker build -t ${{ env.ARTIFACT_REGISTRY }}/ai-service:${{ github.sha }} \
            -t ${{ env.ARTIFACT_REGISTRY }}/ai-service:latest \
            -f services/ai-service/Dockerfile.gcp .
          docker push ${{ env.ARTIFACT_REGISTRY }}/ai-service:${{ github.sha }}
          docker push ${{ env.ARTIFACT_REGISTRY }}/ai-service:latest

      - name: Build and push API Gateway
        run: |
          docker build -t ${{ env.ARTIFACT_REGISTRY }}/api-gateway:${{ github.sha }} \
            -t ${{ env.ARTIFACT_REGISTRY }}/api-gateway:latest \
            -f services/api-gateway/Dockerfile .
          docker push ${{ env.ARTIFACT_REGISTRY }}/api-gateway:${{ github.sha }}
          docker push ${{ env.ARTIFACT_REGISTRY }}/api-gateway:latest

      - name: Build and push Admin Portal
        run: |
          docker build -t ${{ env.ARTIFACT_REGISTRY }}/admin-portal:${{ github.sha }} \
            -t ${{ env.ARTIFACT_REGISTRY }}/admin-portal:latest \
            -f web/admin-portal/Dockerfile web/admin-portal
          docker push ${{ env.ARTIFACT_REGISTRY }}/admin-portal:${{ github.sha }}
          docker push ${{ env.ARTIFACT_REGISTRY }}/admin-portal:latest

  # Job 3: Deploy to staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy AI Service to Cloud Run
        run: |
          gcloud run deploy ai-service-staging \
            --image=${{ env.ARTIFACT_REGISTRY }}/ai-service:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --memory=2Gi \
            --cpu=2 \
            --min-instances=0 \
            --max-instances=5 \
            --set-env-vars=NODE_ENV=staging,GCP_PROJECT_ID=${{ env.PROJECT_ID }} \
            --service-account=cre-services@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --allow-unauthenticated

      - name: Deploy API Gateway to Cloud Run
        run: |
          gcloud run deploy api-gateway-staging \
            --image=${{ env.ARTIFACT_REGISTRY }}/api-gateway:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=5 \
            --set-env-vars=NODE_ENV=staging,GCP_PROJECT_ID=${{ env.PROJECT_ID }} \
            --service-account=cre-services@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --allow-unauthenticated

      - name: Deploy Admin Portal to Cloud Run
        run: |
          gcloud run deploy admin-portal-staging \
            --image=${{ env.ARTIFACT_REGISTRY }}/admin-portal:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=5 \
            --set-env-vars=NODE_ENV=staging \
            --service-account=cre-services@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --allow-unauthenticated

      - name: Get staging URLs
        run: |
          echo "## Staging Deployment URLs" >> $GITHUB_STEP_SUMMARY
          echo "- API Gateway: $(gcloud run services describe api-gateway-staging --region=${{ env.REGION }} --format='value(status.url)')" >> $GITHUB_STEP_SUMMARY
          echo "- Admin Portal: $(gcloud run services describe admin-portal-staging --region=${{ env.REGION }} --format='value(status.url)')" >> $GITHUB_STEP_SUMMARY

  # Job 4: Deploy to production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    if: startsWith(github.ref, 'refs/heads/release/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy services to production
        run: |
          # Deploy AI Service
          gcloud run deploy ai-service \
            --image=${{ env.ARTIFACT_REGISTRY }}/ai-service:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --memory=2Gi \
            --cpu=2 \
            --min-instances=1 \
            --max-instances=10 \
            --set-env-vars=NODE_ENV=production,GCP_PROJECT_ID=${{ env.PROJECT_ID }} \
            --service-account=cre-services@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --vpc-connector=cre-vpc-connector \
            --allow-unauthenticated

          # Deploy API Gateway
          gcloud run deploy api-gateway \
            --image=${{ env.ARTIFACT_REGISTRY }}/api-gateway:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=1 \
            --max-instances=20 \
            --set-env-vars=NODE_ENV=production,GCP_PROJECT_ID=${{ env.PROJECT_ID }} \
            --service-account=cre-services@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --vpc-connector=cre-vpc-connector \
            --allow-unauthenticated

          # Deploy Admin Portal
          gcloud run deploy admin-portal \
            --image=${{ env.ARTIFACT_REGISTRY }}/admin-portal:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=1 \
            --max-instances=10 \
            --set-env-vars=NODE_ENV=production \
            --service-account=cre-services@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --allow-unauthenticated

      - name: Get production URLs
        run: |
          echo "## Production Deployment URLs" >> $GITHUB_STEP_SUMMARY
          echo "- API Gateway: $(gcloud run services describe api-gateway --region=${{ env.REGION }} --format='value(status.url)')" >> $GITHUB_STEP_SUMMARY
          echo "- Admin Portal: $(gcloud run services describe admin-portal --region=${{ env.REGION }} --format='value(status.url)')" >> $GITHUB_STEP_SUMMARY
