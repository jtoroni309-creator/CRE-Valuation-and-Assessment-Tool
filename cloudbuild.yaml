# Cloud Build Configuration for CRE Valuation Platform
# Deploys all services to Google Cloud Run

substitutions:
  _REGION: us-central1
  _PROJECT_ID: ${PROJECT_ID}
  _ENVIRONMENT: production
  _ARTIFACT_REGISTRY: us-central1-docker.pkg.dev/${PROJECT_ID}/cre-platform

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  dynamic_substitutions: true

# Build steps
steps:
  # Step 0: Print build info
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'print-info'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Building CRE Valuation Platform"
        echo "Project: ${PROJECT_ID}"
        echo "Region: $_REGION"
        echo "Environment: $_ENVIRONMENT"
        echo "Commit: $COMMIT_SHA"

  # Step 1: Install dependencies and run tests for shared library
  - name: 'node:20-alpine'
    id: 'test-shared'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        cd services/shared
        npm ci
        npm run lint || true
        npm run test || true
        npm run build

  # Step 2: Build and push AI Service image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-ai-service'
    args:
      - 'build'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/ai-service:$COMMIT_SHA'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/ai-service:latest'
      - '-f'
      - 'services/ai-service/Dockerfile.gcp'
      - '.'
    waitFor: ['test-shared']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-ai-service'
    args:
      - 'push'
      - '--all-tags'
      - '${_ARTIFACT_REGISTRY}/ai-service'
    waitFor: ['build-ai-service']

  # Step 3: Build and push Valuation Service image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-valuation-service'
    args:
      - 'build'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/valuation-service:$COMMIT_SHA'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/valuation-service:latest'
      - '-f'
      - 'services/valuation-service/Dockerfile'
      - '.'
    waitFor: ['test-shared']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-valuation-service'
    args:
      - 'push'
      - '--all-tags'
      - '${_ARTIFACT_REGISTRY}/valuation-service'
    waitFor: ['build-valuation-service']

  # Step 4: Build and push Comparables Service image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-comps-service'
    args:
      - 'build'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/comps-service:$COMMIT_SHA'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/comps-service:latest'
      - '-f'
      - 'services/comps-service/Dockerfile'
      - '.'
    waitFor: ['test-shared']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-comps-service'
    args:
      - 'push'
      - '--all-tags'
      - '${_ARTIFACT_REGISTRY}/comps-service'
    waitFor: ['build-comps-service']

  # Step 5: Build and push Assessment Service image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-assessment-service'
    args:
      - 'build'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/assessment-service:$COMMIT_SHA'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/assessment-service:latest'
      - '-f'
      - 'services/assessment-service/Dockerfile'
      - '.'
    waitFor: ['test-shared']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-assessment-service'
    args:
      - 'push'
      - '--all-tags'
      - '${_ARTIFACT_REGISTRY}/assessment-service'
    waitFor: ['build-assessment-service']

  # Step 6: Build and push Appeals Service image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-appeals-service'
    args:
      - 'build'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/appeals-service:$COMMIT_SHA'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/appeals-service:latest'
      - '-f'
      - 'services/appeals-service/Dockerfile'
      - '.'
    waitFor: ['test-shared']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-appeals-service'
    args:
      - 'push'
      - '--all-tags'
      - '${_ARTIFACT_REGISTRY}/appeals-service'
    waitFor: ['build-appeals-service']

  # Step 7: Build and push Reporting Service image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-reporting-service'
    args:
      - 'build'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/reporting-service:$COMMIT_SHA'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/reporting-service:latest'
      - '-f'
      - 'services/reporting-service/Dockerfile'
      - '.'
    waitFor: ['test-shared']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-reporting-service'
    args:
      - 'push'
      - '--all-tags'
      - '${_ARTIFACT_REGISTRY}/reporting-service'
    waitFor: ['build-reporting-service']

  # Step 8: Build and push Portfolio Service image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-portfolio-service'
    args:
      - 'build'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/portfolio-service:$COMMIT_SHA'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/portfolio-service:latest'
      - '-f'
      - 'services/portfolio-service/Dockerfile'
      - '.'
    waitFor: ['test-shared']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-portfolio-service'
    args:
      - 'push'
      - '--all-tags'
      - '${_ARTIFACT_REGISTRY}/portfolio-service'
    waitFor: ['build-portfolio-service']

  # Step 9: Build and push API Gateway image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-api-gateway'
    args:
      - 'build'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/api-gateway:$COMMIT_SHA'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/api-gateway:latest'
      - '-f'
      - 'services/api-gateway/Dockerfile'
      - '.'
    waitFor: ['test-shared']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-api-gateway'
    args:
      - 'push'
      - '--all-tags'
      - '${_ARTIFACT_REGISTRY}/api-gateway'
    waitFor: ['build-api-gateway']

  # Step 10: Build and push Admin Portal image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-admin-portal'
    args:
      - 'build'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/admin-portal:$COMMIT_SHA'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/admin-portal:latest'
      - '-f'
      - 'web/admin-portal/Dockerfile'
      - 'web/admin-portal'
    waitFor: ['-']  # Start immediately

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-admin-portal'
    args:
      - 'push'
      - '--all-tags'
      - '${_ARTIFACT_REGISTRY}/admin-portal'
    waitFor: ['build-admin-portal']

  # Step 11: Deploy AI Service to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-ai-service'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'ai-service'
      - '--image=${_ARTIFACT_REGISTRY}/ai-service:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--concurrency=80'
      - '--timeout=300'
      - '--set-env-vars=NODE_ENV=production,GCP_PROJECT_ID=${PROJECT_ID},GCP_LOCATION=$_REGION'
      - '--set-secrets=DATABASE_URL=database-url:latest,REDIS_URL=redis-url:latest'
      - '--service-account=cre-services@${PROJECT_ID}.iam.gserviceaccount.com'
      - '--vpc-connector=cre-vpc-connector'
      - '--ingress=internal-and-cloud-load-balancing'
      - '--allow-unauthenticated'
    waitFor: ['push-ai-service']

  # Step 12: Deploy remaining services in parallel
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-valuation-service'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'valuation-service'
      - '--image=${_ARTIFACT_REGISTRY}/valuation-service:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--concurrency=80'
      - '--timeout=300'
      - '--set-env-vars=NODE_ENV=production,GCP_PROJECT_ID=${PROJECT_ID}'
      - '--set-secrets=DATABASE_URL=database-url:latest,REDIS_URL=redis-url:latest'
      - '--service-account=cre-services@${PROJECT_ID}.iam.gserviceaccount.com'
      - '--vpc-connector=cre-vpc-connector'
      - '--ingress=internal-and-cloud-load-balancing'
      - '--allow-unauthenticated'
    waitFor: ['push-valuation-service', 'deploy-ai-service']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-api-gateway'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'api-gateway'
      - '--image=${_ARTIFACT_REGISTRY}/api-gateway:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=1'
      - '--max-instances=20'
      - '--concurrency=100'
      - '--timeout=60'
      - '--set-env-vars=NODE_ENV=production,GCP_PROJECT_ID=${PROJECT_ID}'
      - '--set-secrets=DATABASE_URL=database-url:latest,REDIS_URL=redis-url:latest,JWT_SECRET=jwt-secret:latest'
      - '--service-account=cre-services@${PROJECT_ID}.iam.gserviceaccount.com'
      - '--vpc-connector=cre-vpc-connector'
      - '--ingress=all'
      - '--allow-unauthenticated'
    waitFor: ['push-api-gateway', 'deploy-ai-service']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-admin-portal'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'admin-portal'
      - '--image=${_ARTIFACT_REGISTRY}/admin-portal:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--concurrency=100'
      - '--timeout=60'
      - '--set-env-vars=NODE_ENV=production,NEXT_PUBLIC_GCP_PROJECT_ID=${PROJECT_ID}'
      - '--service-account=cre-services@${PROJECT_ID}.iam.gserviceaccount.com'
      - '--ingress=all'
      - '--allow-unauthenticated'
    waitFor: ['push-admin-portal', 'deploy-api-gateway']

  # Step 13: Run database migrations
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'run-migrations'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Running database migrations..."
        gcloud run jobs execute cre-db-migrations \
          --region=$_REGION \
          --wait \
          || echo "Migrations job not found or already executed"
    waitFor: ['deploy-api-gateway']

  # Step 14: Notify deployment success
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'notify-success'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Deployment completed successfully!"
        echo "API Gateway: https://api-gateway-$(gcloud run services describe api-gateway --region=$_REGION --format='value(status.url)' | cut -d'/' -f3)"
        echo "Admin Portal: https://admin-portal-$(gcloud run services describe admin-portal --region=$_REGION --format='value(status.url)' | cut -d'/' -f3)"
    waitFor: ['deploy-admin-portal', 'run-migrations']

# Images to be pushed to Artifact Registry
images:
  - '${_ARTIFACT_REGISTRY}/ai-service:$COMMIT_SHA'
  - '${_ARTIFACT_REGISTRY}/ai-service:latest'
  - '${_ARTIFACT_REGISTRY}/valuation-service:$COMMIT_SHA'
  - '${_ARTIFACT_REGISTRY}/valuation-service:latest'
  - '${_ARTIFACT_REGISTRY}/api-gateway:$COMMIT_SHA'
  - '${_ARTIFACT_REGISTRY}/api-gateway:latest'
  - '${_ARTIFACT_REGISTRY}/admin-portal:$COMMIT_SHA'
  - '${_ARTIFACT_REGISTRY}/admin-portal:latest'

# Build timeout (30 minutes)
timeout: '1800s'

# Service account for Cloud Build
serviceAccount: 'projects/${PROJECT_ID}/serviceAccounts/cloud-build@${PROJECT_ID}.iam.gserviceaccount.com'
