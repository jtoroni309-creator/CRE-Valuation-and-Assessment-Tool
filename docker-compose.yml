# ============================================================================
# Axxiom Platform - Docker Compose for Local Development
# ============================================================================

version: '3.8'

services:
  # ==========================================================================
  # Database Services
  # ==========================================================================

  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: axxiom-postgres
    environment:
      POSTGRES_USER: axxiom_admin
      POSTGRES_PASSWORD: axxiom_dev_password
      POSTGRES_DB: axxiom_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U axxiom_admin']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - axxiom-network

  redis:
    image: redis:7-alpine
    container_name: axxiom-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - axxiom-network

  # ==========================================================================
  # Backend Microservices
  # ==========================================================================

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: axxiom-api-gateway
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      VALUATION_SERVICE_URL: http://valuation-service:3001
      COMPS_SERVICE_URL: http://comps-service:3002
      ASSESSMENT_SERVICE_URL: http://assessment-service:3003
      APPEALS_SERVICE_URL: http://appeals-service:3004
      REPORTING_SERVICE_URL: http://reporting-service:3005
      AI_SERVICE_URL: http://ai-service:3006
      DATA_INGESTION_SERVICE_URL: http://data-ingestion-service:3007
      COMPUTER_VISION_SERVICE_URL: http://computer-vision-service:3008
      GEOSPATIAL_SERVICE_URL: http://geospatial-service:3009
      PORTFOLIO_SERVICE_URL: http://portfolio-service:3010
      AZURE_REDIS_CONNECTION_STRING: redis://redis:6379
      JWT_SECRET: dev-secret-change-in-production
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - axxiom-network

  valuation-service:
    build:
      context: .
      dockerfile: services/valuation-service/Dockerfile
    container_name: axxiom-valuation-service
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: axxiom_dev
      DB_USER: axxiom_admin
      DB_PASSWORD: axxiom_dev_password
      AZURE_REDIS_CONNECTION_STRING: redis://redis:6379
      JWT_SECRET: dev-secret-change-in-production
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - axxiom-network

  comps-service:
    build:
      context: .
      dockerfile: services/comps-service/Dockerfile
    container_name: axxiom-comps-service
    ports:
      - '3002:3002'
    environment:
      NODE_ENV: development
      PORT: 3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: axxiom_dev
      DB_USER: axxiom_admin
      DB_PASSWORD: axxiom_dev_password
      AZURE_REDIS_CONNECTION_STRING: redis://redis:6379
      JWT_SECRET: dev-secret-change-in-production
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - axxiom-network

  assessment-service:
    build:
      context: .
      dockerfile: services/assessment-service/Dockerfile
    container_name: axxiom-assessment-service
    ports:
      - '3003:3003'
    environment:
      NODE_ENV: development
      PORT: 3003
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: axxiom_dev
      DB_USER: axxiom_admin
      DB_PASSWORD: axxiom_dev_password
      AZURE_REDIS_CONNECTION_STRING: redis://redis:6379
      JWT_SECRET: dev-secret-change-in-production
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - axxiom-network

  appeals-service:
    build:
      context: .
      dockerfile: services/appeals-service/Dockerfile
    container_name: axxiom-appeals-service
    ports:
      - '3004:3004'
    environment:
      NODE_ENV: development
      PORT: 3004
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: axxiom_dev
      DB_USER: axxiom_admin
      DB_PASSWORD: axxiom_dev_password
      AZURE_REDIS_CONNECTION_STRING: redis://redis:6379
      JWT_SECRET: dev-secret-change-in-production
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - axxiom-network

  reporting-service:
    build:
      context: .
      dockerfile: services/reporting-service/Dockerfile
    container_name: axxiom-reporting-service
    ports:
      - '3005:3005'
    environment:
      NODE_ENV: development
      PORT: 3005
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: axxiom_dev
      DB_USER: axxiom_admin
      DB_PASSWORD: axxiom_dev_password
      AZURE_REDIS_CONNECTION_STRING: redis://redis:6379
      JWT_SECRET: dev-secret-change-in-production
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - axxiom-network

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    container_name: axxiom-ai-service
    ports:
      - '3006:3006'
    environment:
      NODE_ENV: development
      PORT: 3006
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${AZURE_OPENAI_DEPLOYMENT_NAME:-gpt-4}
      AZURE_SEARCH_ENDPOINT: ${AZURE_SEARCH_ENDPOINT:-}
      AZURE_SEARCH_API_KEY: ${AZURE_SEARCH_API_KEY:-}
      AZURE_REDIS_CONNECTION_STRING: redis://redis:6379
      JWT_SECRET: dev-secret-change-in-production
      LOG_LEVEL: debug
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - axxiom-network

  data-ingestion-service:
    build:
      context: .
      dockerfile: services/data-ingestion-service/Dockerfile
    container_name: axxiom-data-ingestion-service
    ports:
      - '3007:3007'
    environment:
      NODE_ENV: development
      PORT: 3007
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: axxiom_dev
      DB_USER: axxiom_admin
      DB_PASSWORD: axxiom_dev_password
      MLS_API_KEY: ${MLS_API_KEY:-}
      MLS_ENDPOINT: ${MLS_ENDPOINT:-}
      COSTAR_API_KEY: ${COSTAR_API_KEY:-}
      OCR_API_KEY: ${OCR_API_KEY:-}
      AZURE_REDIS_CONNECTION_STRING: redis://redis:6379
      JWT_SECRET: dev-secret-change-in-production
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - axxiom-network

  computer-vision-service:
    build:
      context: .
      dockerfile: services/computer-vision-service/Dockerfile
    container_name: axxiom-computer-vision-service
    ports:
      - '3008:3008'
    environment:
      NODE_ENV: development
      PORT: 3008
      AZURE_COMPUTER_VISION_ENDPOINT: ${AZURE_COMPUTER_VISION_ENDPOINT:-}
      AZURE_COMPUTER_VISION_API_KEY: ${AZURE_COMPUTER_VISION_API_KEY:-}
      AZURE_REDIS_CONNECTION_STRING: redis://redis:6379
      JWT_SECRET: dev-secret-change-in-production
      LOG_LEVEL: debug
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - axxiom-network

  geospatial-service:
    build:
      context: .
      dockerfile: services/geospatial-service/Dockerfile
    container_name: axxiom-geospatial-service
    ports:
      - '3009:3009'
    environment:
      NODE_ENV: development
      PORT: 3009
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: axxiom_dev
      DB_USER: axxiom_admin
      DB_PASSWORD: axxiom_dev_password
      AZURE_REDIS_CONNECTION_STRING: redis://redis:6379
      JWT_SECRET: dev-secret-change-in-production
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - axxiom-network

  portfolio-service:
    build:
      context: .
      dockerfile: services/portfolio-service/Dockerfile
    container_name: axxiom-portfolio-service
    ports:
      - '3010:3010'
    environment:
      NODE_ENV: development
      PORT: 3010
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: axxiom_dev
      DB_USER: axxiom_admin
      DB_PASSWORD: axxiom_dev_password
      AZURE_REDIS_CONNECTION_STRING: redis://redis:6379
      JWT_SECRET: dev-secret-change-in-production
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - axxiom-network

  # ==========================================================================
  # Frontend Applications
  # ==========================================================================

  admin-portal:
    build:
      context: ./web/admin-portal
      dockerfile: Dockerfile.dev
    container_name: axxiom-admin-portal
    ports:
      - '3100:3100'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
      NEXT_PUBLIC_APP_URL: http://localhost:3100
    volumes:
      - ./web/admin-portal/src:/app/src
      - ./web/admin-portal/public:/app/public
    networks:
      - axxiom-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  axxiom-network:
    driver: bridge
